<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Advisor | สินค้าทั้งหมด</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
    <div class="logo">
  <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
    <img src="logo01.png" alt="PC Advisor Logo" style="height: 38px; object-fit: contain;">
  </a>
</div>
<nav style="display: flex; gap: 20px;">
  <a href="index.html">หน้าแรก</a>
  <a href="products.html">สินค้า</a>
  <a href="builder.html">จัดสเปก</a>
  <a href="favorites.html">รายการโปรด</a>
  <a href="about.html">เกี่ยวกับ</a>
</nav>
    <div id="memberArea" style="display: flex; align-items: center; gap: 10px;">
      <span id="userDisplay" style="color: #fff; font-size: 0.9rem;">Guest</span>
      <button id="authBtn" onclick="toggleAuth()" style="padding: 6px 12px; font-size: 0.85rem; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer;">เข้าสู่ระบบ</button>
    </div>
  </div>
</header>

<main>
  <section id="products" class="section" style="margin-top: 30px;">
    <div class="section-head">
      <div><p class="eyebrow">PRODUCT CATALOG</p><h2>ค้นหาและกรองอุปกรณ์</h2></div>
      <span id="resultCount" class="count"></span>
    </div>

    <div class="filters">
      <input id="search" placeholder="🔍 ค้นหาชื่อสินค้า แบรนด์ หรือรหัสสินค้า...">
      <select id="category"><option value="All">ทุกประเภท</option></select>
      <select id="brand"><option value="All">ทุกแบรนด์</option></select>
      <input id="minPrice" type="number" min="0" placeholder="ราคาต่ำสุด">
      <input id="maxPrice" type="number" min="0" placeholder="ราคาสูงสุด">
      <select id="sort">
        <option value="">เรียงลำดับ</option>
        <option value="price-asc">ราคาน้อย → มาก</option>
        <option value="price-desc">ราคามาก → น้อย</option>
        <option value="name-asc">ชื่อ A → Z</option>
      </select>
      <button id="clearFilters" class="secondary">ล้างตัวกรอง</button>
    </div>

    <div id="productsGrid" class="grid"></div>
  </section>
</main>

<!-- (P05) แถบเปรียบเทียบสินค้าลอยตัว -->
<div id="compareTray" class="compare-tray" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: #fff; padding: 12px 20px; justify-content: space-between; align-items: center; z-index: 999;">
  <div id="compareInfo">เปรียบเทียบสินค้า (0/3)</div>
  <div>
    <button onclick="showComparisonModal()" style="background: #2ed573; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 8px;">ดูตารางเปรียบเทียบ</button>
    <button onclick="clearCompare()" style="background: #ff4757; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">ล้าง</button>
  </div>
</div>

<!-- (P03) Product Detail Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer>PC Advisor Prototype • Node.js + Express</footer>
<script src="script.js"></script>
</body>
</html>
