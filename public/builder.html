<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Advisor | จัดสเปกคอมพิวเตอร์</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
    <!-- โลโก้รูปภาพ -->
    <div class="logo">
      <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
        <img src="logo01.png" alt="PC Advisor Logo" style="height: 38px; object-fit: contain;">
      </a>
    </div>

    <nav style="display: flex; gap: 20px;">
      <a href="index.html">หน้าแรก</a>
      <a href="products.html">สินค้า</a>
      <a href="builder.html" style="color: #007bff; font-weight: bold;">จัดสเปก</a>
      <a href="favorites.html">รายการโปรด</a>
      <a href="about.html">เกี่ยวกับ</a>
    </nav>

    <div id="memberArea" style="display: flex; align-items: center; gap: 10px;">
      <span id="userDisplay" style="color: #fff; font-size: 0.9rem;">Guest</span>
      <button id="authBtn" onclick="toggleAuth()" style="padding: 6px 12px; font-size: 0.85rem; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer;">เข้าสู่ระบบ</button>
    </div>
  </div>
</header>

<main>
  <section id="recommend" class="recommend section" style="margin-top: 40px;">
    <p class="eyebrow">PC BUILD ASSISTANT</p>
    <h2>ช่วยจัดสเปกตามงบประมาณ</h2>
    <p>ระบบจะเลือกอุปกรณ์จากข้อมูลที่มีใน Prototype ให้เหมาะสมกับงบโดยประมาณ พร้อมตรวจสอบความเข้ากันได้ (Compatibility)</p>
    <div class="budget-box">
      <input id="budget" type="number" min="0" value="30000" placeholder="ระบุงบประมาณ">
      <button id="recommendBtn" class="btn">แนะนำสเปก</button>
    </div>
    <div id="recommendResult"></div>
  </section>
</main>

<footer>PC Advisor Prototype • Node.js + Express</footer>
<script type="module" src="script.js"></script>
</body>
</html>
