<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Advisor | รายการโปรด</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="nav" style="display: flex; justify-content: space-between; align-items: center;">
    <!-- โลโก้รูปภาพ -->
    <div class="logo">
      <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
        <img src="logo01.png" alt="PC Advisor Logo" style="height: 38px; object-fit: contain;">
      </a>
    </div>

    <nav style="display: flex; gap: 20px;">
      <a href="index.html">หน้าแรก</a>
      <a href="products.html">สินค้า</a>
      <a href="builder.html">จัดสเปก</a>
      <a href="favorites.html" style="color: #007bff; font-weight: bold;">รายการโปรด</a>
      <a href="about.html">เกี่ยวกับ</a>
    </nav>

    <div id="memberArea" style="display: flex; align-items: center; gap: 10px;">
      <span id="userDisplay" style="color: #fff; font-size: 0.9rem;">Guest</span>
      <button id="authBtn" onclick="toggleAuth()" style="padding: 6px 12px; font-size: 0.85rem; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer;">เข้าสู่ระบบ</button>
    </div>
  </div>
</header>

<main>
  <section id="favorites" class="section" style="margin-top: 40px;">
    <div class="section-head">
      <div><p class="eyebrow">WISHLIST</p><h2>รายการโปรดของคุณ</h2></div>
    </div>
    <div id="favoritesGrid" class="grid"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer>PC Advisor Prototype • Node.js + Express</footer>
<script src="script.js"></script>
</body>
</html>
